  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    :root {
      --primary: #0a2a5e;
      --accent: #ff6b9d;
      --yellow: #ffd166;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--primary);
      color: white;
      line-height: 1.6;
    }
    nav {
      background: rgba(10, 42, 94, 0.95);
      position: sticky;
      top: 0;
      z-index: 1000;
      padding: 15px 0;
    }
    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
    }
    .logo { font-size: 1.8rem; font-weight: bold; }
    .nav-links a {
      color: white;
      text-decoration: none;
      margin-left: 25px;
      font-weight: 500;
      transition: 0.3s;
    }
    .nav-links a:hover { color: var(--accent); }

    .hero {
      text-align: center;
      padding: 120px 20px 80px;
      background: linear-gradient(rgba(10,42,94,0.85), rgba(10,42,94,0.9)),
                  url('https://images.rawpixel.com/image_png_800/cHJpdmF0ZS9sci9pbWFnZXMvd2Vic2l0ZS8yMDIyLTA0L2pvYjY4Ni0yNTMtcC5wbmc.png');
      background-size: cover;
      background-position: center;
    }
    .hero h1 { font-size: 3.8rem; margin-bottom: 15px; }
    .date {
      background: var(--accent);
      color: white;
      padding: 12px 30px;
      border-radius: 50px;
      display: inline-block;
      font-weight: bold;
      font-size: 1.2rem;
    }
    .btn {
      display: inline-block;
      background: var(--accent);
      color: white;
      padding: 16px 36px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 30px;
      transition: all 0.4s;
    }
    .btn:hover {
      background: var(--yellow);
      color: var(--primary);
      transform: scale(1.08);
    }
    footer {
      text-align: center;
      padding: 40px;
      background: #05172f;
      font-size: 0.95rem;
    }
  </style>
</head>

    <br><br>
    <a href="evolution.html" class="btn">Begin the Journey →</a>

  <footer>
